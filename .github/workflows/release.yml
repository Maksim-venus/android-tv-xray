name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/passwall-release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/passwall-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleLegacyRelease assembleModernRelease --stacktrace

      - name: Require the release certificate and v1+v2 signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in \
            app/build/outputs/apk/legacy/release/app-legacy-release.apk \
            app/build/outputs/apk/modern/release/app-modern-release.apk
          do
            # Legacy minSdk is 24, so apksigner skips JAR (v1) whenever v2 is
            # present and reports v1 as false. --min-sdk-version 23 forces the
            # v1 check. Some Android 7.x boxes still install from the JAR signature.
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 "$apk" | tee /tmp/apk-verify.txt
            if grep -q "CN=Android Debug" /tmp/apk-verify.txt; then
              echo "refusing debug-signed $apk" >&2
              exit 1
            fi
            grep -q "CN=Passwall TV" /tmp/apk-verify.txt
            grep -q "69b0b6ddb8e68e43ffa150cd8e75d7a9a60b2087cd54fdf0a7665c98897d118b" /tmp/apk-verify.txt
            grep -q "Signer #1 key size (bits): 4096" /tmp/apk-verify.txt
            grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apk-verify.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apk-verify.txt
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          android_label() {
            case "$1" in
              21) echo "5.0" ;;
              22) echo "5.1" ;;
              23) echo "6.0" ;;
              24) echo "7.0" ;;
              25) echo "7.1" ;;
              26) echo "8.0" ;;
              27) echo "8.1" ;;
              28) echo "9" ;;
              29) echo "10" ;;
              30) echo "11" ;;
              31) echo "12" ;;
              32) echo "12.1" ;;
              33) echo "13" ;;
              34) echo "14" ;;
              35) echo "15" ;;
              *) echo "API$1" ;;
            esac
          }
          sdk_of() {
            "$AAPT" dump badging "$1" | sed -n "s/.*sdkVersion:'\([0-9][0-9]*\)'.*/\1/p" | head -1
          }
          legacy_apk="app/build/outputs/apk/legacy/release/app-legacy-release.apk"
          modern_apk="app/build/outputs/apk/modern/release/app-modern-release.apk"
          legacy_sdk="$(sdk_of "$legacy_apk")"
          modern_sdk="$(sdk_of "$modern_apk")"
          test -n "$legacy_sdk"
          test -n "$modern_sdk"
          legacy_name="Passwall-TV-Android$(android_label "$legacy_sdk")+-${ver}.apk"
          modern_name="Passwall-TV-Android$(android_label "$modern_sdk")+-${ver}.apk"
          mkdir -p dist
          cp "$legacy_apk" "dist/${legacy_name}"
          cp "$modern_apk" "dist/${modern_name}"
          cp INSTALL.txt dist/INSTALL.txt
          if [ "$tag" = "v0.1.9" ]; then
            notes='Re-signed 0.1.9 (versionCode 10) with the long-lived release key. This release needs a one-time uninstall of older versions because the signing key changed. That clears saved nodes. All future updates are signed with this same key and install over the top.'
          else
            notes="Passwall TV ${ver}. ${legacy_name} is minSdk ${legacy_sdk} (Android $(android_label "$legacy_sdk")+). ${modern_name} is minSdk ${modern_sdk} (Android $(android_label "$modern_sdk")+). Signed with the stable release key and installs over the re-signed 0.1.9 build."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/${legacy_name}" \
              "dist/${modern_name}" \
              dist/INSTALL.txt \
              --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release create "$tag" \
              "dist/${legacy_name}" \
              "dist/${modern_name}" \
              dist/INSTALL.txt \
              --target "$GITHUB_SHA" \
              --title "Passwall TV ${tag}" \
              --notes "$notes"
          fi
